# Smithery registry configuration: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      nerdApiUrl:
        title: Nerd API URL
        description: Base URL of the Nerd Utility API instance to query
        type: string
        default: https://feminine-neatness-coliseum.ngrok-free.dev
  commandConfig:
    nerdApiUrl: true
